services:
  mariadb:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: 123
      MARIADB_AUTO_UPGRADE: 1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      # Release branch for frappe, erpnext and hrms
      - FRAPPE_BRANCH=version-16
    working_dir: /home/frappe
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/workspace
      # Keeps the bench (apps, site files, uploads) across `docker compose down`
      - frappe-bench:/home/frappe/benches
    ports:
      - 2000:8000 # web
      - 2002:2002 # socket.io (live updates); host and container port must match

volumes:
  mariadb-data:
  frappe-bench:
